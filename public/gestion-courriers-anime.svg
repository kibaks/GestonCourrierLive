<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" class="gc-mark-animated" role="img" aria-label="GestionCourriers">
<style>.gc-mark-paper,.gc-mark-seal{transform-box:fill-box;transform-origin:center}.gc-mark-animated .gc-mark-paper{animation:gc-letter 2.4s cubic-bezier(.4,0,.2,1) infinite}.gc-mark-animated .gc-mark-lines{animation:gc-ink 2.4s ease-in-out infinite}.gc-mark-animated .gc-mark-seal{animation:gc-validate 2.4s ease-in-out infinite}.gc-mark-animated .gc-mark-check{stroke-dasharray:20;animation:gc-check 2.4s ease-in-out infinite}
@keyframes gc-letter{0%,100%{transform:translateY(9px);opacity:.4}25%,55%{transform:translateY(0);opacity:1}80%{transform:translateY(5px);opacity:1}}
@keyframes gc-ink{0%,12%,100%{opacity:0}32%,75%{opacity:1}}
@keyframes gc-validate{0%,38%,100%{transform:scale(.75);opacity:0}55%,85%{transform:scale(1);opacity:1}}
@keyframes gc-check{0%,45%,100%{stroke-dashoffset:20}65%,90%{stroke-dashoffset:0}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}.gc-mark-check{stroke-dashoffset:0}}</style>
    <defs><linearGradient id="gc-blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#1e3a8a"/><stop offset="1" stop-color="#2563eb"/></linearGradient></defs>
    <rect x="2" y="2" width="92" height="92" rx="25" fill="url(#gc-blue)"/>
    <path d="M15 33V26a11 11 0 0 1 11-11h7M81 63v7a11 11 0 0 1-11 11h-7" fill="none" stroke="#fff" stroke-opacity=".2" stroke-width="2" stroke-linecap="round"/>
    <path d="m18 44 26-18a7 7 0 0 1 8 0l26 18-30 24Z" fill="#a8c5ff"/>
    <g class="gc-mark-paper"><path d="M32 19h23l11 11v36H28V23a4 4 0 0 1 4-4Z" fill="#fff"/><path d="M55 19v8a3 3 0 0 0 3 3h8" fill="#d7e5ff"/>
      <g class="gc-mark-lines" fill="none" stroke="#4678d9" stroke-width="3" stroke-linecap="round"><path d="M36 34h14"/><path d="M36 42h22"/><path d="M36 50h17"/></g>
    </g>
    <path d="M18 44v26a7 7 0 0 0 7 7h46a7 7 0 0 0 7-7V44L51 62a5 5 0 0 1-6 0Z" fill="#edf4ff"/>
    <path d="m19 72 20-15m38 15L57 57" fill="none" stroke="#b2c9f3" stroke-width="2" stroke-linecap="round"/>
    <g class="gc-mark-seal"><circle cx="73" cy="73" r="13" fill="#2563eb" stroke="#fff" stroke-width="3"/><path class="gc-mark-check" d="m67 73 4 4 8-8" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g>
</svg>
